<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Build your coding habit in public. 60 days, one commit and one post at a time." />
    <title>60|Day — Ship code. Build proof. Get seen.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --void: #0B0E14; // ...existing code...

            function landingGridHTML() {
                // teaser grid: first 18 green (done), 19th red (missed), remaining grey (upcoming)
                let cells='';
                const total=45;

                for (let i=0; i < total; i++) {
                    let cls;
                    if (i < 18) cls='done';
                    else if (i===18) cls='missed';
                    else cls='upcoming';
                    cells+=`<div class="cell ${cls}"></div>`;
                }

                return cells;
            }

            // ...existing code...
            --surface: #141B24;
            --surface-2: #1C2530;
            --surface-3: #232D3A;
            --border: #262F3B;
            --border-soft: #1E2733;
            --text: #EDF1F5;
            --text-dim: #8B96A5;
            --text-faint: #57616F;
            --amber: #FF9F1C;
            --amber-dim: #5A4420;
            --teal: #2DD4BF;
            --teal-dim: #123B36;
            --coral: #F0576B;
            --coral-dim: #3E1B22;
            --indigo: #7C8CF8;
            --indigo-dim: #242A4E;
            --radius: 14px;
            --display: 'Space Grotesk',
            sans-serif;
            --mono: 'JetBrains Mono',
            monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--void);
            color: var(--text);
            font-family: var(--display);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }

        ::selection {
            background: var(--amber);
            color: var(--void);
        }

        .mono {
            font-family: var(--mono);
        }

        /* subtle ambient grid texture */
        body {
            background-image:
                radial-gradient(circle at 15% 0%, rgba(255, 159, 28, 0.07), transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(45, 212, 191, 0.06), transparent 40%);
            background-attachment: fixed;
        }

        .wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
        }

        @media(min-width:900px) {
            .wrap {
                max-width: 920px;
            }
        }

        /* ---------- NAV ---------- */
        .topnav {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-soft);
        }

        .topnav-inner {
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media(min-width:900px) {
            .topnav-inner {
                max-width: 920px;
            }
        }

        .logo {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive;
            font-weight: 700;
            font-size: 40px;
            letter-spacing: -0.08em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(255, 159, 28, 0.24), 0 2px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }

        .logo:hover {
            transform: translateY(-1px) rotate(-1deg);
            text-shadow: 0 0 24px rgba(255, 159, 28, 0.32), 0 2px 0 rgba(255, 255, 255, 0.12);
        }

        .logo .n {
            color: #fff;
        }

        .cta-mini {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            background: var(--amber);
            color: #1a1206;
            padding: 8px 14px;
            border-radius: 999px;
        }

        /* ---------- LANDING ---------- */
        .hero {
            padding: 44px 0 20px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .eyebrow::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal);
        }

        h1.hero-title {
            font-size: 38px;
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        h1.hero-title .grad {
            background: linear-gradient(95deg, var(--amber), var(--teal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media(min-width:900px) {
            h1.hero-title {
                font-size: 56px;
            }
        }

        .hero-sub {
            color: var(--text-dim);
            font-size: 16px;
            max-width: 38ch;
            margin-bottom: 26px;
        }

        .hero-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 36px;
        }

        @media(min-width:520px) {
            .hero-actions {
                flex-direction: row;
            }
        }

        .btn-primary {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 14px;
            background: var(--amber);
            color: #1a1206;
            padding: 15px 22px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 0 0 rgba(255, 159, 28, 0);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 159, 28, 0.25);
        }

        .btn-ghost {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 14px;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 15px 22px;
            border-radius: 10px;
            text-align: center;
        }

        /* streak grid — signature element */
        .grid-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }

        .grid-card-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }

        .grid-card-head h3 {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .grid-card-head .mono {
            font-size: 12px;
            color: var(--text-faint);
        }

        .streak-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 4px;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 3px;
            position: relative;
        }

        .cell.upcoming {
            background: #7f8c8d;
        }

        .cell.done {
            background: #2ecc71;
            box-shadow: 0 0 6px rgba(46, 204, 113, 0.35);
        }

        .cell.missed {
            background: #e74c3c;
            border: 1px solid #c0392b;
        }

        .cell.grace {
            background: #3498db;
            border: 1px solid #2c7fb8;
        }

        .cell.today {
            background: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25);
            animation: pulse 2s infinite;
        }

        .cell.today::after {
            content: '✦';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5), 0 0 12px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(255, 159, 28, 0.25);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(255, 159, 28, 0.12);
            }
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text-faint);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .legend-dot-today {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 6px;
            line-height: 1;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .legend-dot-today::before {
            content: '✦';
        }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 32px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
        }

        .stat .num {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 20px;
            color: var(--amber);
        }

        .stat .lbl {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 2px;
        }

        .section {
            padding: 34px 0;
            border-top: 1px solid var(--border-soft);
        }

        .section h2 {
            font-size: 22px;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .section .lede {
            color: var(--text-dim);
            font-size: 14.5px;
            margin-bottom: 22px;
            max-width: 42ch;
        }

        .step {
            display: flex;
            gap: 14px;
            margin-bottom: 22px;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step-num {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
            color: var(--void);
            background: var(--teal);
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .step h4 {
            font-size: 15.5px;
            margin-bottom: 3px;
        }

        .step p {
            font-size: 13.5px;
            color: var(--text-dim);
        }

        .proof-row {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
        }

        .proof-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 16px;
        }

        .proof-card .icon {
            font-family: var(--mono);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .proof-card h4 {
            font-size: 13.5px;
            margin-bottom: 4px;
        }

        .proof-card p {
            font-size: 12px;
            color: var(--text-faint);
        }

        .quote-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 18px;
        }

        .quote-card p {
            font-size: 14px;
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 10px;
        }

        .quote-card .who {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--teal);
        }

        .final-cta {
            padding: 40px 0 60px;
            text-align: center;
        }

        .final-cta h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .final-cta p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 22px;
        }

        footer.site-footer {
            border-top: 1px solid var(--border-soft);
            padding: 26px 0 40px;
        }

        footer.site-footer .mono {
            font-size: 11px;
            color: var(--text-faint);
        }

        /* ---------- APP CHROME (dashboard / day) ---------- */
        .app-topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-soft);
        }

        .app-topbar-inner {
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media(min-width:900px) {
            .app-topbar-inner {
                max-width: 920px;
            }
        }

        .profile-switch {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text-faint);
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .profile-switch select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 10.5px;
            border-radius: 6px;
            padding: 5px 6px;
        }

        .app-body {
            padding: 22px 0 100px;
        }

        .greet {
            font-size: 13.5px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .greet b {
            color: var(--text);
        }

        .streak-hero {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 20px;
            margin: 14px 0 16px;
        }

        .streak-fire {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 159, 28, 0.4));
        }

        .streak-num {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 32px;
            color: var(--amber);
            line-height: 1;
        }

        .streak-lbl {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .streak-day {
            margin-left: auto;
            text-align: right;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
        }

        .streak-day b {
            display: block;
            color: var(--text);
            font-size: 15px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }

        .card-label {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .today-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .today-desc {
            font-size: 13.5px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge.track {
            background: var(--indigo-dim);
            color: var(--indigo);
        }

        .badge.done {
            background: var(--teal-dim);
            color: var(--teal);
        }

        .badge.missed {
            background: var(--coral-dim);
            color: var(--coral);
        }

        .badge.grace {
            background: var(--indigo-dim);
            color: var(--indigo);
        }

        .badge.upcoming {
            background: var(--surface-3);
            color: var(--text-faint);
        }

        .badge.today {
            background: var(--amber-dim);
            color: var(--amber);
        }

        .progress-track {
            height: 8px;
            border-radius: 999px;
            background: var(--surface-3);
            overflow: hidden;
            margin: 10px 0 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--teal), var(--amber));
            border-radius: 999px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
        }

        .achv-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .achv {
            text-align: center;
            padding: 14px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
        }

        .achv.earned {
            background: var(--surface-2);
        }

        .achv.locked {
            opacity: 0.35;
        }

        .achv .ico {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .achv .name {
            font-family: var(--mono);
            font-size: 9.5px;
            color: var(--text-dim);
            line-height: 1.3;
        }

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .empty-state .ico {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty-state h4 {
            font-size: 15px;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .missed-banner {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: var(--coral-dim);
            border: 1px solid rgba(240, 87, 107, 0.3);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .missed-banner .ico {
            font-size: 16px;
        }

        .missed-banner h4 {
            font-size: 13px;
            color: var(--coral);
            margin-bottom: 3px;
        }

        .missed-banner p {
            font-size: 12.5px;
            color: var(--text-dim);
        }

        /* bottom tab bar */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: rgba(20, 27, 36, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: center;
        }

        .tabbar-inner {
            max-width: 480px;
            width: 100%;
            display: flex;
            padding: 8px 20px calc(8px + env(safe-area-inset-bottom));
        }

        @media(min-width:900px) {
            .tabbar-inner {
                max-width: 920px;
            }
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 6px 4px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-faint);
        }

        .tab .ico {
            font-size: 17px;
            display: block;
            margin-bottom: 2px;
        }

        .tab.active {
            color: var(--amber);
        }

        /* ---------- DAY PAGE ---------- */
        .day-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .day-nav a {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .day-nav a.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .day-strip {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .day-strip .chip {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border-soft);
            color: var(--text-faint);
        }

        .day-strip .chip.current {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-dim);
        }

        .day-strip .chip.done {
            color: var(--teal);
        }

        .day-strip .chip.missed {
            color: var(--coral);
        }

        .day-strip .chip.grace {
            color: var(--indigo);
        }

        .day-head h1 {
            font-size: 24px;
            margin: 10px 0 4px;
            letter-spacing: -0.01em;
        }

        .day-head .track-name {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
            margin-bottom: 14px;
        }

        .checklist {
            list-style: none;
            margin-top: 10px;
        }

        .checklist li {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-size: 13.5px;
            color: var(--text-dim);
            padding: 9px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .checklist li:last-child {
            border-bottom: none;
        }

        .checklist li::before {
            content: '—';
            color: var(--teal);
            flex-shrink: 0;
        }

        .field-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
            margin-bottom: 6px;
            display: block;
        }

        .field {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 13.5px;
            margin-bottom: 14px;
            font-family: var(--mono);
        }

        .field::placeholder {
            color: var(--text-faint);
        }

        .field:focus {
            outline: 2px solid var(--teal);
            outline-offset: 1px;
        }

        .btn-block {
            width: 100%;
        }

        .btn-secondary {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 13px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
        }

        .btn-grace {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 13px;
            background: var(--indigo-dim);
            border: 1px solid var(--indigo);
            color: var(--indigo);
            padding: 13px 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submitted-proof {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .proof-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 11px 13px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--teal);
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--indigo);
            color: #0d0f1e;
            font-family: var(--mono);
            font-weight: 600;
            font-size: 12.5px;
            padding: 12px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        @media (prefers-reduced-motion: reduce) {
            .cell.today {
                animation: none;
            }

            * {
                transition: none !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="toast" class="toast mono"></div>

    <script>
        /* ============ MOCK DATA ============ */
        const TOTAL_DAYS = 60;

        const HAND_TASKS = {
            1: {
                title: "Set up your dev environment", desc: "Install your stack, initialize a Git repo, and push an empty commit. First proof is the easiest one.",
                checklist: ["Create a new GitHub repository", "Add a README describing what you'll build over 60 days", "Push your first commit", "Write a LinkedIn post announcing you're starting the challenge"]
            },
            2: {
                title: "Build a static landing page", desc: "Ship a single HTML page for the project you'll build this track. No frameworks yet — just structure and intent.",
                checklist: ["Create index.html with a hero section", "Deploy it anywhere (Vercel, Netlify, GitHub Pages)", "Commit with a clear message", "Post a screenshot on LinkedIn"]
            },
            3: {
                title: "Add responsive layout", desc: "Make yesterday's page work on a phone. Most recruiters will open your link on mobile first.",
                checklist: ["Add a mobile-first CSS layout", "Test at 390px width", "Commit the responsive pass"]
            },
            4: {
                title: "Wire up basic interactivity", desc: "Add at least one interactive element with vanilla JS — a toggle, a form, a filter.",
                checklist: ["Add one interactive UI element", "No frameworks required", "Commit and push"]
            },
            5: {
                title: "Pick your core feature", desc: "Define the one feature that makes your project worth building. Write it down before you code it.",
                checklist: ["Write a 3-line feature spec in your README", "Sketch the data you'll need", "Commit the spec"]
            },
            6: {
                title: "Build your data layer", desc: "Model the core data your feature needs — a JSON file, a schema, or a simple in-memory store.",
                checklist: ["Define your data shape", "Seed it with realistic mock data", "Commit"]
            },
            7: {
                title: "Ship the first working slice", desc: "One real, working feature end to end. Not polished — working.",
                checklist: ["Feature works locally", "Deployed link updated", "LinkedIn post: what you shipped in week 1"]
            },
            8: {
                title: "Refactor for clarity", desc: "Go back over week 1's code. Rename things, split functions, delete dead code.",
                checklist: ["No functions over ~40 lines", "Consistent naming", "Commit: 'refactor: week 1 cleanup'"]
            },
            9: {
                title: "Add error handling", desc: "Find three ways your app breaks. Handle them gracefully instead of letting it crash silently.",
                checklist: ["Handle empty states", "Handle failed requests", "Commit"]
            },
            10: {
                title: "Write your first tests", desc: "Pick your riskiest function and cover it with tests. Doesn't need to be exhaustive.",
                checklist: ["Add a test runner", "Write 3+ test cases", "Commit"]
            },
            11: {
                title: "Improve your README", desc: "A recruiter should understand your project in 30 seconds from the README alone.",
                checklist: ["Add a project summary", "Add setup instructions", "Add a live link and screenshot"]
            },
            12: {
                title: "Add authentication (mocked)", desc: "Build a login flow using mocked state — no real backend needed yet. Focus on the experience, not the security.",
                checklist: ["Design a login screen", "Store session in memory or local state", "Handle the logged-out state", "Commit and post your progress"]
            },
        };

        function generateTask(day) {
            if (HAND_TASKS[day]) return HAND_TASKS[day];
            const templates = [
                { t: "Build a {x}", d: "Design and ship a working {x}. Keep scope small enough to finish tonight." },
                { t: "Optimize your {x}", d: "Find the slowest or clunkiest part of your {x} and make it better." },
                { t: "Add {x} to your project", d: "Extend what you've built with {x} — commit it as its own feature." },
                { t: "Polish the {x}", d: "Spend today on details in your {x} — spacing, copy, edge cases." },
                { t: "Document your {x}", d: "Write clear docs or comments for your {x} so someone else could pick it up." },
            ];
            const topics = ["API layer", "search feature", "dashboard view", "notification system", "form validation",
                "caching layer", "component library", "state management", "onboarding flow", "settings page",
                "empty states", "loading states", "dark mode toggle", "pagination", "filter UI", "upload flow",
                "profile page", "analytics view", "export feature", "permissions model"];
            const tpl = templates[day % templates.length];
            const topic = topics[day % topics.length];
            return {
                title: tpl.t.replace("{x}", topic),
                desc: tpl.d.replace("{x}", topic),
                checklist: ["Build the feature end to end", "Deploy the update", "Commit with a clear message", "Post progress or a learning on LinkedIn"]
            };
        }

        const TRACK = "Full-Stack Web Development";

        /* Build day records 1..60 with a status, per profile */
        function buildDays(overrides) {
            const days = {};
            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const task = generateTask(i);
                days[i] = { day: i, ...task, status: 'upcoming', proof: null };
            }
            Object.entries(overrides).forEach(([day, status]) => { days[day].status = status; });
            return days;
        }

        const PROFILES = {
            active: {
                name: "Aditi Sharma", initial: "A", track: TRACK, currentDay: 12, graceTotal: 2, graceUsed: 1,
                days: buildDays({ 1: 'done', 2: 'done', 3: 'done', 4: 'done', 5: 'grace', 6: 'done', 7: 'done', 8: 'done', 9: 'done', 10: 'done', 11: 'done', 12: 'today' })
            },
            fresh: {
                name: "", initial: "?", track: TRACK, currentDay: 1, graceTotal: 2, graceUsed: 0,
                days: buildDays({ 1: 'today' })
            },
            broken: {
                name: "Rohan Verma", initial: "R", track: TRACK, currentDay: 12, graceTotal: 2, graceUsed: 0,
                days: buildDays({ 1: 'done', 2: 'done', 3: 'done', 4: 'done', 5: 'done', 6: 'done', 7: 'done', 8: 'missed', 9: 'done', 10: 'done', 11: 'done', 12: 'today' })
            }
        };

        // mark days after currentDay as upcoming explicitly (already default) and add sample proof for done days
        Object.values(PROFILES).forEach(p => {
            Object.values(p.days).forEach(d => {
                if (d.status === 'done' || d.status === 'grace') {
                    d.proof = { github: `github.com/aditisharma/60day/commit/${d.day}a1f`, linkedin: `linkedin.com/posts/day-${d.day}-progress` };
                }
            });
        });

        let currentProfileKey = 'active';
        let profile = PROFILES[currentProfileKey];

        /* ============ HELPERS ============ */
        function computeStreak(p) {
            let streak = 0;
            for (let d = p.currentDay - 1; d >= 1; d--) {
                const s = p.days[d].status;
                if (s === 'done' || s === 'grace') streak++;
                else break;
            }
            return streak;
        }
        function completionCount(p) {
            return Object.values(p.days).filter(d => d.status === 'done' || d.status === 'grace').length;
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        /* ============ ROUTER ============ */
        function navigate(path, push = true) {
            if (push) history.pushState({}, '', path);
            render();
        }
        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[data-link]');
            if (a) {
                e.preventDefault();
                navigate(a.getAttribute('href'));
            }
        });
        window.addEventListener('popstate', render);

        function render() {
            const path = window.location.pathname;
            const app = document.getElementById('app');
            let dayMatch = path.match(/^\/day\/(\d+)\/?$/);
            if (path === '/' || path === '') {
                app.innerHTML = renderLanding();
            } else if (path === '/dashboard' || path === '/dashboard/') {
                app.innerHTML = renderDashboard();
                wireDashboard();
            } else if (dayMatch) {
                const dnum = Math.max(1, Math.min(TOTAL_DAYS, parseInt(dayMatch[1], 10)));
                app.innerHTML = renderDay(dnum);
                wireDay(dnum);
            } else {
                app.innerHTML = renderLanding();
            }
            window.scrollTo(0, 0);
        }

        /* ============ LANDING ============ */
        function landingGridHTML() {
            // teaser grid: first 18 green (done), 19th red (missed), remaining grey (upcoming)
            let cells = '';
            const total = 45;
            for (let i = 0; i < total; i++) {
                let cls;
                if (i < 18) cls = 'done';
                else if (i === 18) cls = 'missed';
                else cls = 'upcoming';
                cells += `<div class="cell ${cls}"></div>`;
            }
            return cells;
        }
        function renderLanding() {
            return `
  <nav class="topnav"><div class="topnav-inner">
    <div class="logo">AB talks</div>
    <a href="/dashboard" data-link class="cta-mini">Sign in</a>
  </div></nav>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">For students who are tired of "add project to resume"</div>
      <h1 class="hero-title">Ship code every day.<br>Build a <span class="grad">public streak</span><br>recruiters can see.</h1>
      <p class="hero-sub">A 60-day challenge for Indian college students. Pick a track, build something daily, and prove it with a GitHub commit and a LinkedIn post — no fluff, just consistency.</p>
      <div class="hero-actions">
        <a href="/dashboard" data-link class="btn-primary">Start your streak →</a>
        <a href="#how" class="btn-ghost">See how it works</a>
      </div>

      <div class="grid-card">
        <div class="grid-card-head">
          <h3>Sample streak — Day 19 of 60</h3>
          <span class="mono">live preview</span>
        </div>
        <div class="streak-grid">${landingGridHTML()}</div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span>Shipped</div>
          <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span>Grace</div>
          <div class="legend-item"><span class="legend-dot" style="background:#e74c3c;border:1px solid #c0392b"></span>Missed</div>
          <div class="legend-item"><span class="legend-dot-today"></span>Today</div>
          <div class="legend-item"><span class="legend-dot" style="background:#7f8c8d"></span>Upcoming</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat"><div class="num">640+</div><div class="lbl">students building</div></div>
        <div class="stat"><div class="num">11.2k</div><div class="lbl">commits shipped</div></div>
        <div class="stat"><div class="num">58%</div><div class="lbl">finish all 60 days</div></div>
      </div>
    </section>

    <section class="section" id="how">
      <h2>How it works</h2>
      <p class="lede">Three steps. Repeat daily for 60 days.</p>
      <div class="step">
        <div class="step-num">1</div>
        <div><h4>Pick a track</h4><p>Web dev, AI/ML, or DSA — a fresh daily task in that lane, calibrated to build a real project over 60 days.</p></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div><h4>Build something small, every day</h4><p>15 minutes or 3 hours — what matters is that you ship. Late-night sessions after class count just as much.</p></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div><h4>Submit your proof</h4><p>A GitHub commit shows you can build. A LinkedIn post shows you can communicate. Recruiters see both.</p></div>
      </div>
    </section>

    <section class="section">
      <h2>What counts as proof</h2>
      <p class="lede">No quizzes, no attendance. Just work you can point to.</p>
      <div class="proof-row">
        <div class="proof-card">
          <div class="icon">⌥</div>
          <h4>GitHub commit</h4>
          <p>Linked to today's task. Public, timestamped, real.</p>
        </div>
        <div class="proof-card">
          <div class="icon">in</div>
          <h4>LinkedIn post</h4>
          <p>What you built and what you learned — visible to your network.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Miss a day? You're not out.</h2>
      <p class="lede">College happens — exams, fests, bad weeks. Every student gets 2 Grace Days per challenge to cover a missed day within 48 hours, marked transparently on the streak so it stays honest.</p>
      <div class="quote-card">
        <p>"I used a grace day during my mid-sems and it saved my whole streak. Didn't feel like cheating — it's built into the system."</p>
        <div class="who">— Priya, DSA track, Day 47</div>
      </div>
    </section>

    <section class="final-cta">
      <h2>Your streak starts on Day 1.</h2>
      <p>Not tomorrow. Not "when things calm down."</p>
      <a href="/dashboard" data-link class="btn-primary" style="display:inline-flex;padding:15px 32px;">Start your streak →</a>
    </section>

    <footer class="site-footer">
      <p class="mono">60|Day — a 60-day build-in-public challenge · <a href="mailto:team@abtalks.in">team@abtalks.in</a></p>
    </footer>
  </main>
  `;
        }

        /* ============ DASHBOARD ============ */
        function achievementDefs(p) {
            const streak = computeStreak(p);
            const done = completionCount(p);
            return [
                { ico: '🔥', name: '7-Day Streak', earned: streak >= 7 },
                { ico: '⛰', name: 'Halfway There', earned: done >= 30 },
                { ico: '🎯', name: 'First Proof', earned: done >= 1 },
            ];
        }
        function renderDashboard() {
            const p = profile;
            const streak = computeStreak(p);
            const done = completionCount(p);
            const pct = Math.round((done / TOTAL_DAYS) * 100);
            const todayTask = p.days[p.currentDay];
            const missedYesterday = p.currentDay > 1 && p.days[p.currentDay - 1].status === 'missed';

            let gridCells = '';
            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const d = p.days[i];
                gridCells += `<a href="/day/${i}" data-link class="cell ${d.status}" title="Day ${i}: ${d.status}"></a>`;
            }

            const isEmptyProfile = !p.name;
            const isFirstDay = p.currentDay === 1 && done === 0;

            return `
  ${appTopbar('dashboard')}
  <main class="wrap app-body">

    ${isEmptyProfile ? `
      <div class="empty-state" style="margin-bottom:16px;">
        <div class="ico">👋</div>
        <h4>Set up your profile</h4>
        <p>Add your name and track so recruiters know who's behind the streak.</p>
        <button class="btn-secondary" style="width:auto;padding:10px 18px;" onclick="showToast('Profile setup coming soon')">Add your name</button>
      </div>
    ` : `<p class="greet">Welcome back, <b>${p.name.split(' ')[0]}</b></p>`}

    <div class="streak-hero">
      <div class="streak-fire">${streak > 0 ? '🔥' : '🌱'}</div>
      <div>
        <div class="streak-num">${streak}</div>
        <div class="streak-lbl">${streak === 0 ? "day streak — let's start one" : (streak === 1 ? "day streak" : "day streak")}</div>
      </div>
      <div class="streak-day">Day <b>${p.currentDay}</b> of ${TOTAL_DAYS}</div>
    </div>

    ${missedYesterday ? `
      <div class="missed-banner">
        <div class="ico">⚠</div>
        <div>
          <h4>You missed Day ${p.currentDay - 1}</h4>
          <p>That's okay — every builder has off days. You have ${p.graceTotal - p.graceUsed} Grace Day${(p.graceTotal - p.graceUsed) !== 1 ? 's' : ''} left to cover it, or just rebuild your streak starting today.</p>
        </div>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-label">Today's task · Day ${p.currentDay}</div>
      <span class="badge track">${p.track}</span>
      <div class="today-title" style="margin-top:10px;">${todayTask.title}</div>
      <div class="today-desc">${todayTask.desc}</div>
      <a href="/day/${p.currentDay}" data-link class="btn-primary btn-block">
        ${isFirstDay ? 'Ship your first proof →' : 'Open today\'s task →'}
      </a>
    </div>

    <div class="card">
      <div class="card-label">Overall completion</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-meta"><span>${done} / ${TOTAL_DAYS} days shipped</span><span>${pct}%</span></div>
    </div>

    <div class="grid-card">
      <div class="grid-card-head">
        <h3>Your streak grid</h3>
        <span class="mono">tap any day</span>
      </div>
      <div class="streak-grid">${gridCells}</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span>Shipped</div>
        <div class="legend-item"><span class="legend-dot" style="background:#3498db"></span>Grace</div>
        <div class="legend-item"><span class="legend-dot" style="background:#e74c3c;border:1px solid #c0392b"></span>Missed</div>
        <div class="legend-item"><span class="legend-dot-today"></span>Today</div>
        <div class="legend-item"><span class="legend-dot" style="background:#7f8c8d"></span>Upcoming</div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Standing & achievements</div>
      <div class="achv-row">
        ${achievementDefs(p).map(a => `
          <div class="achv ${a.earned ? 'earned' : 'locked'}">
            <div class="ico">${a.ico}</div>
            <div class="name">${a.name}</div>
          </div>`).join('')}
      </div>
    </div>

  </main>
  ${tabbar('dashboard')}
  `;
        }

        /* ============ DAY PAGE ============ */
        function statusLabel(s) {
            return { done: 'Shipped', missed: 'Missed', grace: 'Covered with Grace Day', today: 'Today', upcoming: 'Upcoming' }[s] || s;
        }
        function renderDay(dnum) {
            const p = profile;
            const d = p.days[dnum];
            const isFuture = dnum > p.currentDay;
            const isPastUndone = dnum < p.currentDay && d.status === 'upcoming';

            let strip = '';
            const start = Math.max(1, dnum - 3), end = Math.min(TOTAL_DAYS, dnum + 3);
            for (let i = start; i <= end; i++) {
                const dd = p.days[i];
                let cls = dd.status === 'today' ? '' : dd.status;
                if (i === dnum) cls += ' current';
                strip += `<a href="/day/${i}" data-link class="chip ${cls}">${i}</a>`;
            }

            let actionBlock = '';
            if (d.status === 'done' || d.status === 'grace') {
                actionBlock = `
      <div class="card-label" style="margin-top:18px;">Submitted proof</div>
      <div class="submitted-proof">
        <div class="proof-link">⌥ &nbsp;${d.proof ? d.proof.github : 'github.com/…'}</div>
        <div class="proof-link">in &nbsp;${d.proof ? d.proof.linkedin : 'linkedin.com/…'}</div>
      </div>
      ${d.status === 'grace' ? `<p style="font-family:var(--mono);font-size:11px;color:var(--indigo);margin-top:10px;">Covered with a Grace Day — visible and honest on your streak.</p>` : ''}
    `;
            } else if (d.status === 'missed') {
                const graceLeft = p.graceTotal - p.graceUsed;
                actionBlock = `
      <div class="missed-banner">
        <div class="ico">⚠</div>
        <div><h4>This day was missed</h4><p>No proof was submitted within 48 hours of Day ${dnum}.</p></div>
      </div>
      ${graceLeft > 0 ? `
        <button id="graceBtn" class="btn-grace btn-block">🛡 Cover with a Grace Day (${graceLeft} of ${p.graceTotal} remaining)</button>
        <p style="font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:10px;">This restores your streak and marks the day as "Grace" — visible on your public grid, never hidden.</p>
      ` : `<p style="font-family:var(--mono);font-size:11px;color:var(--text-faint);">No Grace Days remaining. This day stays marked as missed.</p>`}
    `;
            } else if (isFuture) {
                actionBlock = `<div class="empty-state"><div class="ico">🔒</div><h4>Not unlocked yet</h4><p>Day ${dnum} opens once you reach it in your challenge timeline.</p></div>`;
            } else {
                // today or past-undone: show submission form
                actionBlock = `
      <label class="field-label">GitHub repository or commit link</label>
      <input class="field" id="ghInput" placeholder="github.com/you/project/commit/…" />
      <label class="field-label">LinkedIn post link</label>
      <input class="field" id="liInput" placeholder="linkedin.com/posts/…" />
      <button id="submitBtn" class="btn-primary btn-block">Mark Day ${dnum} complete →</button>
      ${isPastUndone ? `<p style="font-family:var(--mono);font-size:11px;color:var(--coral);margin-top:10px;">This day is overdue — submit within 48 hours or it will be marked missed.</p>` : ''}
    `;
            }

            return `
  ${appTopbar('day')}
  <main class="wrap app-body">
    <div class="day-nav">
      <a href="/day/${dnum - 1}" data-link class="${dnum <= 1 ? 'disabled' : ''}">← Day ${dnum - 1}</a>
      <a href="/dashboard" data-link class="mono">Dashboard</a>
      <a href="/day/${dnum + 1}" data-link class="${dnum >= TOTAL_DAYS ? 'disabled' : ''}">Day ${dnum + 1} →</a>
    </div>

    <div class="day-strip">${strip}</div>

    <div class="day-head">
      <span class="badge ${d.status === 'today' ? 'today' : d.status}">${statusLabel(d.status)}</span>
      <h1>Day ${dnum}: ${d.title}</h1>
      <div class="track-name">${p.track}</div>
    </div>

    <div class="card">
      <div class="card-label">Today's task</div>
      <p style="font-size:14px;color:var(--text-dim);">${d.desc}</p>
      <ul class="checklist">
        ${d.checklist.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="card-label">Submit proof of work</div>
      ${actionBlock}
    </div>
  </main>
  ${tabbar('day')}
  `;
        }

        /* ============ SHARED CHROME ============ */
        function appTopbar(active) {
            return `
  <nav class="app-topbar"><div class="app-topbar-inner">
    <a href="/dashboard" data-link class="logo">AB talks</a>
    <div class="profile-switch">
      Demo profile:
      <select id="profileSelect">
        <option value="active" ${currentProfileKey === 'active' ? 'selected' : ''}>Active (Day 12)</option>
        <option value="fresh" ${currentProfileKey === 'fresh' ? 'selected' : ''}>Fresh (Day 1)</option>
        <option value="broken" ${currentProfileKey === 'broken' ? 'selected' : ''}>Missed day (Day 12)</option>
      </select>
    </div>
  </div></nav>`;
        }
        function tabbar(active) {
            const p = profile;
            return `
  <nav class="tabbar"><div class="tabbar-inner">
    <a href="/dashboard" data-link class="tab ${active === 'dashboard' ? 'active' : ''}"><span class="ico">▦</span>Dashboard</a>
    <a href="/day/${p.currentDay}" data-link class="tab ${active === 'day' ? 'active' : ''}"><span class="ico">◆</span>Today</a>
    <a href="/" data-link class="tab"><span class="ico">↗</span>Home</a>
  </div></nav>`;
        }

        function wireDashboard() {
            const sel = document.getElementById('profileSelect');
            if (sel) sel.addEventListener('change', (e) => {
                currentProfileKey = e.target.value;
                profile = PROFILES[currentProfileKey];
                render();
            });
        }
        function wireDay(dnum) {
            const sel = document.getElementById('profileSelect');
            if (sel) sel.addEventListener('change', (e) => {
                currentProfileKey = e.target.value;
                profile = PROFILES[currentProfileKey];
                render();
            });
            const graceBtn = document.getElementById('graceBtn');
            if (graceBtn) graceBtn.addEventListener('click', () => {
                profile.days[dnum].status = 'grace';
                profile.days[dnum].proof = { github: `github.com/aditisharma/60day/commit/${dnum}a1f`, linkedin: `linkedin.com/posts/day-${dnum}-progress` };
                profile.graceUsed += 1;
                showToast(`Day ${dnum} covered — streak restored 🛡`);
                setTimeout(() => render(), 400);
            });
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.addEventListener('click', () => {
                const gh = document.getElementById('ghInput').value.trim();
                const li = document.getElementById('liInput').value.trim();
                if (!gh || !li) { showToast('Add both links to submit'); return; }
                profile.days[dnum].status = 'done';
                profile.days[dnum].proof = { github: gh, linkedin: li };
                showToast(`Day ${dnum} marked complete ✓`);
                setTimeout(() => render(), 400);
            });
        }

        /* ============ INIT ============ */
        render();
    </script>
</body>

</html>
